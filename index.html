<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PANTAU SATRIA • PTT & SOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #ffffff; user-select: none; -webkit-user-select: none; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .ptt-ring { transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 45px rgba(16, 185, 129, 0.3), inset 0 0 30px rgba(16, 185, 129, 0.2); }
        .ptt-ring.transmitting { box-shadow: 0 0 65px rgba(239, 68, 68, 0.8), inset 0 0 35px rgba(239, 68, 68, 0.5); transform: scale(0.95); }
        .ptt-ring.receiving { box-shadow: 0 0 65px rgba(16, 185, 129, 0.8), inset 0 0 35px rgba(16, 185, 129, 0.5); }
        @keyframes sos-flash { 0%, 100% { background-color: rgba(127, 29, 29, 0.4); } 50% { background-color: rgba(220, 38, 38, 0.8); } }
        .sos-active-bg { animation: sos-flash 0.6s infinite; }
        #map { height: 260px; width: 100%; border-radius: 0.75rem; z-index: 10; border: 1px solid #374151; }
        .leaflet-container { background: #030712; }
    </style>
</head>
<body id="app-body" class="min-h-screen flex flex-col justify-between max-w-md mx-auto border-x border-slate-800 shadow-2xl relative">
    
    <header class="bg-slate-900 border-b border-slate-700 px-4 py-3 sticky top-0 z-40">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <!-- LOGO RESMI SATRIA -->
                <div class="w-11 h-11 rounded-xl bg-slate-950 border-2 border-red-500 flex items-center justify-center relative shadow-lg overflow-hidden flex-shrink-0">
                    <img src="https://raw.githubusercontent.com/abuaqila007-gif/Pantau-satria/main/logo.png" alt="SATRIA" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=100&auto=format&fit=crop&q=60';">
                    <span id="net-dot" class="w-3 h-3 rounded-full bg-amber-400 absolute -top-0.5 -right-0.5 animate-pulse border-2 border-slate-900"></span>
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <h1 class="font-extrabold text-sm tracking-wide text-white">PANTAU SATRIA</h1>
                        <span id="net-badge" class="text-[9px] mono px-1.5 py-0.5 rounded bg-amber-500/30 text-amber-300 border border-amber-500/50 font-extrabold">KONEK...</span>
                    </div>
                    <p class="text-[9px] text-emerald-400 font-bold mono tracking-wider">BERSAMA • BERKARYA • BERBAGI</p>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="openCallsignModal()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-2.5 py-1.5 rounded-xl text-left shadow">
                    <div class="text-[8px] text-slate-400 mono leading-none font-bold">CALLSIGN</div>
                    <div id="my-callsign-label" class="text-xs font-extrabold text-emerald-400 mono truncate max-w-[85px]">SATRIA-01</div>
                </button>
                <button onclick="triggerSOS()" class="bg-red-600 hover:bg-red-500 active:scale-95 text-white font-extrabold px-3 py-2 rounded-xl text-xs mono flex items-center gap-1 shadow-lg shadow-red-600/40 border border-red-400"><span>🚨</span> SOS</button>
            </div>
        </div>
    </header>

    <div id="sos-alert-banner" class="hidden bg-red-600 text-white px-4 py-3 border-b-2 border-white animate-pulse">
        <div class="flex items-center justify-between">
            <div>
                <div class="font-extrabold text-xs tracking-wider uppercase">🚨 DARURAT SOS DITERIMA!</div>
                <div id="sos-sender-info" class="text-xs mono font-bold mt-0.5">Pengirim: -</div>
            </div>
            <div class="flex items-center gap-1.5">
                <a id="sos-gmaps-link" href="#" target="_blank" class="bg-white text-red-700 font-extrabold text-xs px-2.5 py-1.5 rounded-lg shadow">📍 Peta</a>
                <button onclick="stopSOSSiren()" class="bg-red-950 text-white font-bold text-xs px-2.5 py-1.5 rounded-lg border border-red-300">Matikan</button>
            </div>
        </div>
    </div>

    <main class="flex-1 px-4 py-3 space-y-3.5 overflow-y-auto">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-3.5 flex items-center justify-between shadow-md">
            <div class="flex items-center gap-3">
                <div id="rx-tx-indicator" class="w-4 h-4 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/60"></div>
                <div>
                    <div id="monitor-status" class="text-xs font-extrabold tracking-wider text-emerald-400 mono">STANDBY • SIAP MONITOR</div>
                    <div class="text-[11px] text-slate-300 font-semibold mono">Frekuensi Komunikasi Aman</div>
                </div>
            </div>
            <div class="text-right mono">
                <div class="text-[10px] text-slate-400 font-bold">ONLINE</div>
                <div id="online-count" class="text-sm font-extrabold text-white">1 Anggota</div>
            </div>
        </div>

        <div class="flex flex-col items-center py-4 relative">
            <div class="flex items-center justify-between w-full mb-3 px-1">
                <button onclick="togglePttMode()" id="ptt-mode-btn" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold mono flex items-center gap-1.5 shadow"><span>🎙️</span> Mode: Tahan</button>
                <button onclick="replayLastVoice()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-emerald-300 px-3 py-2 rounded-xl text-xs font-bold mono flex items-center gap-1.5 shadow"><span>▶️</span> Putar Suara</button>
            </div>
            <button id="ptt-button" class="ptt-ring w-52 h-52 rounded-full bg-gradient-to-b from-slate-800 to-slate-950 border-4 border-emerald-500 flex flex-col items-center justify-center active:scale-95 select-none touch-none relative shadow-2xl">
                <i data-lucide="mic" id="ptt-icon" class="w-16 h-16 text-emerald-400 mb-2"></i>
                <span id="ptt-main-text" class="font-extrabold text-sm tracking-widest text-white mono">TAHAN BICARA</span>
                <span class="text-[10px] text-slate-300 font-bold mono mt-1">Tekan & Tahan untuk Ngobrol</span>
            </button>
        </div>

        <div class="bg-slate-900 border border-slate-700 rounded-2xl p-3 space-y-2.5 shadow-md">
            <div class="flex items-center justify-between">
                <span class="text-xs font-extrabold text-white mono flex items-center gap-1.5"><span>🗺️</span> RADAR LOKASI REKAN</span>
                <button onclick="centerMyMap()" class="bg-slate-800 hover:bg-slate-700 text-emerald-300 border border-slate-600 px-2.5 py-1.5 rounded-xl text-xs font-bold mono shadow">🎯 Posisi Saya</button>
            </div>
            <div id="map"></div>
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-[11px] font-bold text-slate-300 mono uppercase">📻 RIWAYAT TRANSMISI SUARA</span>
                    <button onclick="clearLogs()" class="text-[11px] text-slate-400 hover:text-white font-bold mono">Bersihkan</button>
                </div>
                <div id="log-container" class="space-y-2 max-h-44 overflow-y-auto pr-1"></div>
            </div>
        </div>
    </main>

    <div id="callsign-modal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-600 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl">
            <h3 class="font-extrabold text-sm text-white mono">ATUR IDENTITAS ANGGOTA</h3>
            <div>
                <label class="text-xs text-slate-300 font-bold block mb-1.5">Nama Panggilan & Cabang:</label>
                <input id="callsign-input" type="text" placeholder="Contoh: ADY - UNGARAN" class="w-full bg-slate-950 border border-slate-600 rounded-xl px-3.5 py-2.5 text-sm text-white mono focus:outline-none focus:border-emerald-500 font-bold">
            </div>
            <div>
                <label class="text-xs text-slate-300 font-bold block mb-1.5">Kode Grup Jaringan:</label>
                <input id="room-input" type="text" value="satria-rts-nusantara" class="w-full bg-slate-950 border border-slate-600 rounded-xl px-3.5 py-2.5 text-xs text-emerald-400 mono font-bold">
            </div>
            <div class="flex justify-end gap-2.5 pt-2">
                <button onclick="closeCallsignModal()" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-200 text-xs font-bold">Batal</button>
                <button onclick="saveCallsign()" class="px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold shadow-lg">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        let myId = 'u_' + Math.random().toString(36).substring(2, 9);
        let myCallsign = localStorage.getItem('satria_callsign') || ('SATRIA-' + Math.floor(10 + Math.random() * 89));
        let roomCode = localStorage.getItem('satria_room') || 'satria-rts-nusantara';
        let pttMode = 'hold';
        let isTransmitting = false;
        let myLat = -7.1350, myLng = 110.4050, myAlt = 420;
        let lastAudioUrl = null, mediaRecorder = null, audioChunks = [], mqttClient = null, membersMap = {};

        document.getElementById('my-callsign-label').innerText = myCallsign;
        document.getElementById('callsign-input').value = myCallsign;
        document.getElementById('room-input').value = roomCode;

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null, sosInterval = null;

        function ensureAudio() { if (!audioCtx) audioCtx = new AudioCtx(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function playHTChirp(type = 'start') {
            ensureAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'start') {
                osc.frequency.setValueAtTime(1400, now); osc.frequency.setValueAtTime(1950, now + 0.04);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'end') {
                osc.frequency.setValueAtTime(1800, now); osc.frequency.setValueAtTime(1250, now + 0.05);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.13);
                osc.start(now); osc.stop(now + 0.13);
            } else if (type === 'rx') {
                osc.frequency.setValueAtTime(2100, now); gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07);
                osc.start(now); osc.stop(now + 0.07);
            }
        }

        function startSOSSiren() {
            ensureAudio();
            if (sosInterval) clearInterval(sosInterval);
            document.getElementById('app-body').classList.add('sos-active-bg');
            sosInterval = setInterval(() => {
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.connect(gain); gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(680, now); osc.frequency.linearRampToValueAtTime(1180, now + 0.3);
                gain.gain.setValueAtTime(0.3, now); gain.gain.exponentialRampToValueAtTime(0.02, now + 0.35);
                osc.start(now); osc.stop(now + 0.35);
            }, 420);
        }

        function stopSOSSiren() {
            if (sosInterval) { clearInterval(sosInterval); sosInterval = null; }
            document.getElementById('app-body').classList.remove('sos-active-bg');
            document.getElementById('sos-alert-banner').classList.add('hidden');
        }

        const map = L.map('map', { zoomControl: false }).setView([myLat, myLng], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© OpenStreetMap' }).addTo(map);
        let mapMarkers = {};

        function updateMemberMarker(id, callsign, lat, lng, isSOS = false) {
            if (!lat || !lng) return;
            const color = isSOS ? '#ef4444' : (id === myId ? '#10b981' : '#38bdf8');
            const htmlIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="background:${color};color:#000;font-weight:900;font-family:monospace;font-size:11px;padding:3px 8px;border-radius:6px;border:2px solid #fff;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,0.8);">${isSOS ? '🚨 ' : ''}${callsign}</div>`,
                iconSize: [100, 26], iconAnchor: [50, 13]
            });
            if (mapMarkers[id]) { mapMarkers[id].setLatLng([lat, lng]); mapMarkers[id].setIcon(htmlIcon); }
            else { mapMarkers[id] = L.marker([lat, lng], { icon: htmlIcon }).addTo(map); }
            mapMarkers[id].bindPopup(`<div style="font-family:sans-serif;font-size:12px;color:#0f172a;font-weight:bold;"><b>${callsign}</b><br/><a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" style="color:#0284c7;font-weight:bold;">📍 Navigasi Google Maps</a></div>`);
            membersMap[id] = { callsign, lat, lng };
            document.getElementById('online-count').innerText = Object.keys(membersMap).length + ' Anggota';
        }

        function centerMyMap() { map.setView([myLat, myLng], 14); }

        if (navigator.geolocation) {
            navigator.geolocation.watchPosition((pos) => {
                myLat = pos.coords.latitude; myLng = pos.coords.longitude;
                updateMemberMarker(myId, myCallsign, myLat, myLng);
            }, () => {}, { enableHighAccuracy: true });
        }

        function getTopic(sub) { return `pantau_satria_simple/${roomCode}/${sub}`; }

        function connectRealtimeServer() {
            if (mqttClient) mqttClient.end();
            const badge = document.getElementById('net-badge'), dot = document.getElementById('net-dot');
            badge.innerText = 'KONEK...';
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: 'satria_simp_' + myId + '_' + Math.floor(Math.random() * 9999), clean: true, reconnectPeriod: 3000 });
            mqttClient.on('connect', () => {
                badge.innerText = 'ONLINE';
                badge.className = 'text-[9px] mono px-1.5 py-0.5 rounded bg-emerald-500/30 text-emerald-300 border border-emerald-500/60 font-extrabold';
                dot.className = 'w-3 h-3 rounded-full bg-emerald-400 absolute -top-0.5 -right-0.5 border-2 border-slate-900';
                mqttClient.subscribe(getTopic('ptt'));
                mqttClient.subscribe(getTopic('sos'));
            });
            mqttClient.on('message', (topic, message) => {
                try { const data = JSON.parse(message.toString()); handleIncomingPacket(data); } catch (e) {}
            });
        }

        function publishPacket(subTopic, payload) {
            const fullData = { senderId: myId, callsign: myCallsign, lat: myLat, lng: myLng, timestamp: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }), ...payload };
            if (mqttClient && mqttClient.connected) mqttClient.publish(getTopic(subTopic), JSON.stringify(fullData));
            handleIncomingPacket(fullData, true);
        }

        function handleIncomingPacket(data, isLocalEcho = false) {
            if (!isLocalEcho && data.senderId === myId) return;
            updateMemberMarker(data.senderId, data.callsign, data.lat, data.lng, data.type === 'sos');
            if (data.type === 'voice') {
                if (!isLocalEcho) { playHTChirp('rx'); playIncomingVoice(data.audioBase64, data.callsign); }
                addLogItem(data);
            } else if (data.type === 'sos') {
                startSOSSiren();
                document.getElementById('sos-alert-banner').classList.remove('hidden');
                document.getElementById('sos-sender-info').innerText = `${data.callsign} (${data.timestamp})`;
                document.getElementById('sos-gmaps-link').href = `https://www.google.com/maps?q=${data.lat},${data.lng}`;
                map.setView([data.lat, data.lng], 15);
                addLogItem(data);
            }
        }

        async function startVoiceCapture() {
            if (isTransmitting) return;
            ensureAudio();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                const options = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? { mimeType: 'audio/webm;codecs=opus', audioBitsPerSecond: 16000 } : {};
                mediaRecorder = new MediaRecorder(stream, options);
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => { lastAudioUrl = reader.result; publishPacket('ptt', { type: 'voice', text: '🎙️ Pesan Suara PTT', audioBase64: reader.result }); };
                    reader.readAsDataURL(blob);
                };
                mediaRecorder.start(); isTransmitting = true; playHTChirp('start'); updatePTTUI('tx');
            } catch (err) { alert('Izinkan akses Mikrofon di browser.'); }
        }

        function stopVoiceCapture() {
            if (!isTransmitting) return;
            isTransmitting = false;
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
            playHTChirp('end'); updatePTTUI('idle');
        }

        function playIncomingVoice(base64Audio, senderCallsign) {
            lastAudioUrl = base64Audio; updatePTTUI('rx', senderCallsign);
            const audio = new Audio(base64Audio);
            audio.onended = () => { playHTChirp('end'); updatePTTUI('idle'); };
            audio.play().catch(() => updatePTTUI('idle'));
        }

        function replayLastVoice() {
            if (!lastAudioUrl) { alert('Belum ada pesan suara.'); return; }
            new Audio(lastAudioUrl).play();
        }

        function updatePTTUI(state, speaker = '') {
            const btn = document.getElementById('ptt-button'), status = document.getElementById('monitor-status'), dot = document.getElementById('rx-tx-indicator'), mainText = document.getElementById('ptt-main-text');
            btn.classList.remove('transmitting', 'receiving');
            if (state === 'tx') {
                btn.classList.add('transmitting'); status.innerText = 'TRANSMITTING • MENGIRIM...'; status.className = 'text-xs font-extrabold tracking-wider text-red-400 mono'; dot.className = 'w-4 h-4 rounded-full bg-red-500 animate-ping'; mainText.innerText = 'SEDANG BICARA';
            } else if (state === 'rx') {
                btn.classList.add('receiving'); status.innerText = `RECEIVING • ${speaker}`; status.className = 'text-xs font-extrabold tracking-wider text-emerald-300 mono'; dot.className = 'w-4 h-4 rounded-full bg-emerald-400 animate-ping'; mainText.innerText = 'SUARA MASUK';
            } else {
                status.innerText = 'STANDBY • SIAP MONITOR'; status.className = 'text-xs font-extrabold tracking-wider text-emerald-400 mono'; dot.className = 'w-4 h-4 rounded-full bg-emerald-500'; mainText.innerText = pttMode === 'hold' ? 'TAHAN BICARA' : 'SENTUH BICARA';
            }
        }

        const pttBtn = document.getElementById('ptt-button');
        pttBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); if (pttMode === 'hold') startVoiceCapture(); else isTransmitting ? stopVoiceCapture() : startVoiceCapture(); });
        pttBtn.addEventListener('pointerup', (e) => { e.preventDefault(); if (pttMode === 'hold' && isTransmitting) stopVoiceCapture(); });

        function togglePttMode() {
            pttMode = pttMode === 'hold' ? 'toggle' : 'hold';
            document.getElementById('ptt-mode-btn').innerHTML = pttMode === 'hold' ? '<span>🎙️</span> Mode: Tahan' : '<span>🔒</span> Mode: 1-Tap';
            updatePTTUI('idle');
        }

        function triggerSOS() {
            if (confirm('Kirim Sinyal Darurat SOS ke semua anggota?')) {
                startSOSSiren();
                publishPacket('sos', { type: 'sos', text: '🚨 SINYAL DARURAT SOS AKTIF!' });
            }
        }

        function addLogItem(data) {
            const container = document.getElementById('log-container'), div = document.createElement('div');
            const isSOS = data.type === 'sos';
            div.className = `p-2.5 rounded-xl border text-xs flex items-center justify-between ${isSOS ? 'bg-red-950 border-red-500 text-red-100 font-bold' : 'bg-slate-950 border-slate-700 text-slate-200'}`;
            div.innerHTML = `<div class="space-y-0.5"><div class="flex items-center gap-1.5"><span class="font-extrabold mono text-emerald-400 text-sm">${data.callsign}</span><span class="text-[10px] text-slate-400 mono">• ${data.timestamp}</span></div><div class="font-bold">${data.text}</div></div><div class="flex items-center gap-1.5">${data.audioBase64 ? `<button onclick="playIncomingVoice('${data.audioBase64}', '${data.callsign}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1.5 rounded-lg text-[10px] font-extrabold mono shadow">▶️ Putar</button>` : ''}<a href="https://www.google.com/maps?q=${data.lat},${data.lng}" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-sky-300 px-2.5 py-1.5 rounded-lg text-[10px] font-extrabold mono border border-slate-600 shadow">📍 Peta</a></div>`;
            container.prepend(div);
        }

        function clearLogs() { document.getElementById('log-container').innerHTML = ''; }
        function openCallsignModal() { document.getElementById('callsign-modal').classList.remove('hidden'); }
        function closeCallsignModal() { document.getElementById('callsign-modal').classList.add('hidden'); }
        function saveCallsign() {
            const val = document.getElementById('callsign-input').value.trim().toUpperCase();
            const rm = document.getElementById('room-input').value.trim().toLowerCase();
            if (val) { myCallsign = val; localStorage.setItem('satria_callsign', myCallsign); document.getElementById('my-callsign-label').innerText = myCallsign; }
            if (rm) { roomCode = rm; localStorage.setItem('satria_room', roomCode); }
            closeCallsignModal(); connectRealtimeServer();
            updateMemberMarker(myId, myCallsign, myLat, myLng);
        }

        connectRealtimeServer();
    </script>
</body>
</html>
